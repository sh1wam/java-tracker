<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Java Roadmap Tracker</title>
    <link rel="stylesheet" href="styles.css " />
  </head>
  <body>
    <main>
      <h1>Java Roadmap Tracker</h1>
      <p class="sub">
        Tick items as you finish them. Progress saves in this browser and, once
        connected, to progress.json in your GitHub repo.
      </p>
      <div class="top">
        <div class="big"><b id="pct">0%</b><span id="cnt"></span></div>
        <i class="bar"><u id="all"></u></i>
        <div class="tools">
          <input
            type="search"
            id="q"
            placeholder="Search topics"
            aria-label="Search topics"
          />
          <button id="hd" aria-pressed="false">Hide done</button>
          <button id="rs">Reset</button>
        </div>
      </div>
      <details id="gh">
        <summary>
          <span>GitHub sync</span
          ><span class="c" id="st">Saved in this browser only</span>
        </summary>
        <div class="gf">
          <input
            id="repo"
            placeholder="username/repo-name"
            aria-label="Repository"
          />
          <input
            id="tok"
            type="password"
            placeholder="Fine-grained token (Contents: read and write)"
            aria-label="Token"
          />
          <div class="tools">
            <button id="gs">Connect and sync</button
            ><button id="gx">Disconnect</button>
          </div>
        </div>
      </details>
      <div id="app"></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
